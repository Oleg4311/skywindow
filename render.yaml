services:
  - type: web
    name: skywindow
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://oleg4311.github.io
      - key: WINDY_WEBCAMS_API_KEY
        sync: false
